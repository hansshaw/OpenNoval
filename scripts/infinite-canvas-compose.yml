services:
  canvas:
    build:
      context: ../third_party/infinite-canvas
      dockerfile: Dockerfile
    image: ainovel-infinite-canvas:ccda172
    env_file:
      - ${AINOVEL_CANVAS_ENV:?Start with node scripts/infinite-canvas.mjs start}
    volumes:
      - ${AINOVEL_CANVAS_DATA:?Start with node scripts/infinite-canvas.mjs start}:/app/data
    ports:
      - "127.0.0.1:${AINOVEL_CANVAS_PORT:-3000}:3000"
    restart: unless-stopped

name: Desktop acceptance

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  electron:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install desktop runtime
        working-directory: desktop
        run: |
          npm ci
          node node_modules/electron/install.js
      - name: Use release tag version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm --prefix desktop version "${RELEASE_TAG#v}" --no-git-tag-version --allow-same-version
      - name: Unit tests
        run: npm --prefix desktop test
      - name: Configure Linux Chromium sandbox
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root desktop/node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 desktop/node_modules/electron/dist/chrome-sandbox
      - name: Complete creative workflow
        env:
          AINOVEL_CREATIVE_E2E_REPORT: ${{ github.workspace }}/desktop/dist/reports/creative-workflow.json
        run: go test -count=1 -run 'TestCreative(Desktop|Background)Workflow' -v ./internal/entry/desktopui
      - name: Linux hidden-window acceptance
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a npm --prefix desktop run smoke
          xvfb-run -a npm --prefix desktop run test:e2e
      - name: Windows hidden-window acceptance
        if: runner.os == 'Windows'
        run: |
          npm --prefix desktop run smoke
          npm --prefix desktop run test:e2e
      - name: Build desktop installers
        run: npm run dist
      - name: Configure packaged Linux Chromium sandbox
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root desktop/dist/linux-unpacked/chrome-sandbox
          sudo chmod 4755 desktop/dist/linux-unpacked/chrome-sandbox
      - name: Linux packaged acceptance
        if: runner.os == 'Linux'
        run: xvfb-run -a npm --prefix desktop run smoke:packaged
      - name: Windows packaged acceptance
        if: runner.os == 'Windows'
        run: npm --prefix desktop run smoke:packaged
      - name: Save desktop installers
        uses: actions/upload-artifact@v4
        with:
          name: desktop-installers-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.blockmap
          if-no-files-found: error
      - name: Save acceptance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-acceptance-${{ matrix.os }}
          path: desktop/dist/reports/*.json
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: electron
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified desktop installers
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-installers-*
          path: desktop-release
          merge-multiple: true
      - name: Generate installer checksums
        working-directory: desktop-release
        run: sha256sum *.exe *.AppImage *.deb > SHA256SUMS.txt
      - name: Publish desktop release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" desktop-release/* --clobber
          else
            gh release create "$RELEASE_TAG" desktop-release/* --title "$RELEASE_TAG" --generate-notes --verify-tag
          fi

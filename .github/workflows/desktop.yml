name: Desktop acceptance

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  electron:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      AINOVEL_DESKTOP_TEST_TRACE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install desktop runtime
        working-directory: desktop
        run: |
          npm ci
          node node_modules/electron/install.js
      - name: Unit tests
        run: npm --prefix desktop test
      - name: Configure Linux Chromium sandbox
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root desktop/node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 desktop/node_modules/electron/dist/chrome-sandbox
      - name: Complete creative workflow
        env:
          AINOVEL_CREATIVE_E2E_REPORT: ${{ github.workspace }}/desktop/dist/reports/creative-workflow.json
        run: go test -count=1 -run 'TestCreative(Desktop|Background)Workflow' -v ./internal/entry/desktopui
      - name: Linux hidden-window acceptance
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a npm --prefix desktop run smoke
          xvfb-run -a npm --prefix desktop run test:e2e
      - name: Windows hidden-window acceptance
        if: runner.os == 'Windows'
        run: |
          npm --prefix desktop run smoke
          npm --prefix desktop run test:e2e
      - name: Build desktop installers
        run: npm run dist
      - name: Build previous-version Windows upgrade fixture
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Match the original installer identity: its GUID was derived from appId.
          # The fixture is test-only and is never uploaded to a Release.
          node -e 'const fs = require("fs"); const config = structuredClone(require("./desktop/package.json").build); delete config.nsis.guid; config.extraMetadata = { version: "0.0.0" }; config.directories.output = "dist/upgrade-fixture"; fs.writeFileSync("desktop/dist/upgrade-fixture.json", JSON.stringify(config));'
          npm --prefix desktop run dist:win -- --x64 --config dist/upgrade-fixture.json
      - name: Configure packaged Linux Chromium sandbox
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root desktop/dist/linux-unpacked/chrome-sandbox
          sudo chmod 4755 desktop/dist/linux-unpacked/chrome-sandbox
      - name: Linux packaged acceptance
        if: runner.os == 'Linux'
        run: xvfb-run -a npm --prefix desktop run smoke:packaged
      - name: Windows packaged acceptance
        if: runner.os == 'Windows'
        run: npm --prefix desktop run smoke:packaged
      - name: Windows installer upgrade in original directory
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          ./desktop/scripts/test-windows-installer.ps1 `
            -PreviousInstaller "desktop/dist/upgrade-fixture/ainovel-desktop-0.0.0-win-x64-setup.exe" `
            -Installer "desktop/dist/ainovel-desktop-$version-win-x64-setup.exe" `
            -ExpectedVersion $version
      - name: Upgrade the previous public Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          $releases = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect previous releases.' }
          $previous = $releases | Where-Object { -not $_.draft -and -not $_.prerelease -and $_.tag_name -match '^v\d+\.\d+\.\d+$' -and [version]$_.tag_name.Substring(1) -lt [version]($version -split '-')[0] } | Sort-Object { [version]$_.tag_name.Substring(1) } -Descending | Select-Object -First 1
          if ($null -eq $previous) { Write-Host 'No earlier public release; implicit-GUID fixture upgrade already passed.'; exit 0 }
          $asset = $previous.assets | Where-Object { $_.name -match '^ainovel-desktop-.+-win-x64-setup\.exe$' } | Select-Object -First 1
          if ($null -eq $asset) { throw 'Previous stable release has no Windows x64 installer.' }
          gh release download $previous.tag_name --repo $env:GITHUB_REPOSITORY --pattern $asset.name --dir desktop/dist/previous-release
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the previous Windows installer.' }
          ./desktop/scripts/test-windows-installer.ps1 `
            -PreviousInstaller "desktop/dist/previous-release/$($asset.name)" `
            -Installer "desktop/dist/ainovel-desktop-$version-win-x64-setup.exe" `
            -ExpectedVersion $version `
            -ReportPath desktop/dist/reports/windows-public-installer-upgrade.json
      - name: Save desktop installers
        uses: actions/upload-artifact@v4
        with:
          name: desktop-installers-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.blockmap
          if-no-files-found: error
      - name: Save acceptance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-acceptance-${{ matrix.os }}
          path: desktop/dist/reports/*.json
          if-no-files-found: warn

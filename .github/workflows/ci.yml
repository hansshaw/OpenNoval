name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Format check
        shell: bash
        run: test -z "$(git ls-files '*.go' | xargs gofmt -l)"

      - name: Vet
        env:
          GOWORK: "off"
        run: go vet ./...

      - name: Test
        env:
          GOWORK: "off"
        run: go test -buildvcs=false -count=1 ./...

      - name: Race test critical state paths
        if: runner.os == 'Linux'
        env:
          GOWORK: "off"
        run: go test -race -buildvcs=false -count=1 ./internal/bootstrap ./internal/modelrequest ./internal/entry/desktopui ./internal/mobilebridge ./internal/host ./internal/store ./internal/tools ./internal/projectversion ./internal/projectjobs ./internal/chaptermedia ./internal/mediaworkspace ./internal/novelreader

  desktop-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Install pinned desktop test dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm --prefix desktop ci
      - name: Verify offline reader assets
        run: npm --prefix desktop run vendor:check
      - name: Desktop renderer and main process syntax
        run: |
          node --check internal/entry/desktopui/static/app.js
          node --check internal/entry/desktopui/static/android.js
          node --check internal/entry/desktopui/static/mobile.js
          node --check internal/entry/desktopui/static/models.js
          node --check internal/entry/desktopui/static/versions.js
          node --check internal/entry/desktopui/static/jobs.js
          node --check internal/entry/desktopui/static/novel-reader.js
          node --check internal/entry/desktopui/static/readable-data.js
          node --check internal/mediaworkspace/ui/media.js
          node --check desktop/main.js
          node --check desktop/security.js
      - name: Desktop database and trust boundary tests
        run: npm --prefix desktop test
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Android active-work power protection tests
        run: bash mobile/scripts/test-work-protection.sh
